[package]
name = "pulse"
version = "1.3.0"
edition = "2021"
description = "Pulse system vitals for GNOME: a top bar entry and a 420px flyout"
license = "MIT"
build = "build.rs"

[[bin]]
name = "pulse"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "pulse-catalog"
path = "src/bin/pulse-catalog.rs"

[lib]
name = "pulse"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw", "dep:gdk4-x11", "dep:pangocairo", "dep:async-channel", "dep:zbus", "dep:serde"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }
gdk4-x11 = { version = "0.11", features = ["xlib"], optional = true }
pangocairo = { version = "0.22", optional = true }
async-channel = { version = "2", optional = true }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
libc = "0.2"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
