name: macos

on:
  push:
    paths:
      - "native/macos/**"
      - "locales/**"
      - "i18n/test/fixtures/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "native/macos/**"
      - "locales/**"
      - "i18n/test/fixtures/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: native/macos

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CAN_NOTARIZE: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Locale catalog is current
        run: swift run -c release pulse-catalog --check

      - name: Test PulseCore (plural vectors, catalog round trip, grouping, history)
        run: swift test

      - name: Build universal Pulse.app
        run: bash scripts/build-app.sh

      # Signs with Developer ID, notarizes and staples, so Macs open the app
      # with no "couldn't be verified" warning. Skipped until the five
      # repository secrets exist; the app then stays signed ad hoc.
      - name: Sign and notarize
        if: env.CAN_NOTARIZE == 'true'
        timeout-minutes: 40
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-and-notarize.sh

      - name: Inspect bundle
        run: |
          lipo -info dist/Pulse.app/Contents/MacOS/Pulse
          plutil -p dist/Pulse.app/Contents/Info.plist
          codesign --verify --verbose=2 dist/Pulse.app
          codesign --display --verbose=2 dist/Pulse.app 2>&1 | grep -E 'Authority|Signature|flags' || true

      - name: Probe real telemetry on the runner
        timeout-minutes: 2
        run: dist/Pulse.app/Contents/MacOS/Pulse --probe

      # Serves a fake latest.json from a local server and checks the app reads it.
      - name: Update check against a local manifest
        timeout-minutes: 2
        run: |
          site="$(mktemp -d)"
          mkdir -p "$site/build/macos"
          echo '{"version":"9.9.9","files":{"universal":{"path":"build/macos/Pulse-macos-universal.zip","sha256":"00","size":1}}}' > "$site/build/macos/latest.json"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site" >/dev/null 2>&1 &
          server=$!
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/build/macos/latest.json >/dev/null && break; sleep 0.5; done
          out="$(PULSE_UPDATE_URL=http://127.0.0.1:8765/ dist/Pulse.app/Contents/MacOS/Pulse --update-check)"
          kill $server
          echo "$out"
          echo "$out" | grep -q 'latest=9.9.9'

      - name: Render flyout screenshots
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p dist/screenshots
          dist/Pulse.app/Contents/MacOS/Pulse --render "$PWD/dist/screenshots"
          ls -la dist/screenshots

      - name: Upload app and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-universal
          path: |
            native/macos/dist/Pulse-macos-universal.zip
            native/macos/dist/screenshots/*.png
          if-no-files-found: warn

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pulse-macos-universal
          path: /tmp/mac
      - name: Put the app in build/macos
        run: |
          cp /tmp/mac/Pulse-macos-universal.zip build/macos/Pulse-macos-universal.zip
          python3 tools/update_manifest.py macos universal=build/macos/Pulse-macos-universal.zip
          git config user.name "njarrar"
          git config user.email "njarrar@gmail.com"
          git add build/macos
          git diff --cached --quiet && exit 0
          git commit -m "Update macOS app in build/macos"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i*5)); done
