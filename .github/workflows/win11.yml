# Pulse for Windows 11: test the platform-neutral library, then build and
# publish the WinUI 3 app for x64 and ARM64 with Native AOT.
name: win11

on:
  push:
    paths:
      - "native/win11/**"
      - "locales/**"
      - ".github/workflows/win11.yml"
  pull_request:
    paths:
      - "native/win11/**"
      - "locales/**"
      - ".github/workflows/win11.yml"
  workflow_dispatch:

defaults:
  run:
    shell: pwsh
    working-directory: native/win11

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests (i18n engine, plural vectors, .resw round trip, formatting, history)
        run: dotnet test tests/Pulse.Core.Tests -c Release --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - name: Catalog generator (locales/*.json to Strings/<lang>/Resources.resw)
        run: |
          dotnet run --project tools/Pulse.CatalogGen -c Release -- ../../locales $env:RUNNER_TEMP/strings
          Get-ChildItem -Recurse $env:RUNNER_TEMP/strings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: native/win11/TestResults

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build (${{ matrix.platform }})
        run: dotnet build src/Pulse.App/Pulse.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
      - name: Publish with Native AOT (${{ matrix.platform }})
        run: dotnet publish src/Pulse.App/Pulse.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - name: Publish the launcher (${{ matrix.platform }})
        run: dotnet publish src/Pulse.Launcher/Pulse.Launcher.csproj -c Release -r ${{ matrix.rid }} -o publish/launcher-${{ matrix.rid }}
      - name: Lay out the package (Pulse.exe, data, lang)
        run: |
          ./tools/package.ps1 -App publish/${{ matrix.rid }} -Launcher publish/launcher-${{ matrix.rid }} -Out package/${{ matrix.rid }}
          Get-ChildItem package/${{ matrix.rid }}/data | Sort-Object Length -Descending | Select-Object -First 10 Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-win11-${{ matrix.rid }}
          path: native/win11/package/${{ matrix.rid }}

  # Unzip the app into an empty folder and start it, the way a user would on a
  # clean PC. Two machines: Windows Server for x64, Windows 11 on Arm for ARM64.
  smoke:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2025
          - rid: win-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: Pulse-win11-${{ matrix.rid }}
          path: ${{ runner.temp }}/unzipped
      - name: Start Pulse.exe and check it stays up
        run: |
          $zip = "$env:RUNNER_TEMP/Pulse-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/unzipped/*" -DestinationPath $zip
          $dir = "$env:RUNNER_TEMP/clean"
          Expand-Archive $zip $dir
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize
          $start = Get-Date
          $top = Get-ChildItem $dir | Where-Object { -not $_.PSIsContainer }
          if (($top.Name -join ',') -ne 'Pulse.exe') { throw "Top folder should hold only Pulse.exe and folders, found: $($top.Name -join ', ')" }
          # A crash writes crash.log and exits instead of waiting on a message box.
          $env:PULSE_NO_DIALOG = '1'
          $launcher = Start-Process "$dir/Pulse.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $launcher.WaitForExit(15000) | Out-Null
          "Launcher exit code: $($launcher.ExitCode)"
          Start-Sleep -Seconds 20
          $app = (Resolve-Path "$dir/data/Pulse.exe").Path
          $p = Get-Process Pulse -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $app }
          $alive = $null -ne $p
          if ($alive) {
            "Pulse is running: pid $($p.Id), $([math]::Round($p.WorkingSet64/1MB)) MB"
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save("$env:RUNNER_TEMP/screen.png")
            } catch { "No screenshot: $_" }
            # Right-click the tray icon (the message Explorer sends) and read the menu that opens.
            Add-Type -Namespace W -Name U -MemberDefinition @'
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string n);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern IntPtr SendMessageW(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr m);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetMenuStringW(IntPtr m, uint i, System.Text.StringBuilder s, int n, uint f);
          '@
            $tray = [W.U]::FindWindowW('PulseTrayWindow', [NullString]::Value)
            if ($tray -eq [IntPtr]::Zero) { throw "No tray window" }
            $menuWnd = [IntPtr]::Zero
            for ($try = 0; $try -lt 3 -and $menuWnd -eq [IntPtr]::Zero; $try++) {
              [W.U]::PostMessageW($tray, 0x8001, [IntPtr](200 + (200 -shl 16)), [IntPtr](0x7B + (1 -shl 16))) | Out-Null
              for ($i = 0; $i -lt 10 -and $menuWnd -eq [IntPtr]::Zero; $i++) {
                Start-Sleep -Milliseconds 500
                $menuWnd = [W.U]::FindWindowW('#32768', [NullString]::Value)
              }
            }
            if ($menuWnd -eq [IntPtr]::Zero) { throw "Right-click did not open a menu" }
            $hmenu = [W.U]::SendMessageW($menuWnd, 0x01E1, [IntPtr]::Zero, [IntPtr]::Zero)
            $items = for ($i = 0; $i -lt [W.U]::GetMenuItemCount($hmenu); $i++) {
              $sb = New-Object System.Text.StringBuilder 256
              [void][W.U]::GetMenuStringW($hmenu, [uint32]$i, $sb, 256, 0x400); $sb.ToString()
            }
            "Tray menu: $(($items | Where-Object { $_ }) -join ' | ')"
            foreach ($want in 'Open Pulse', 'Check for Updates', 'Quit') {
              if (-not ($items | Where-Object { $_ -like "$want*" })) { throw "Tray menu has no '$want'" }
            }
            [W.U]::PostMessageW($menuWnd, 0x0100, [IntPtr]0x1B, [IntPtr]::Zero) | Out-Null
            Start-Sleep -Seconds 1
            # Quit the way a user does (same path as the tray menu's Quit) and check it closes cleanly.
            Start-Process "$dir/Pulse.exe" -ArgumentList '--quit' -Wait
            if ($p.WaitForExit(15000)) { "Pulse quit cleanly" }
            else { Stop-Process -Id $p.Id -Force; throw "Pulse did not close after --quit" }
          }
          "--- crash log"; Get-Content "$env:LOCALAPPDATA/Pulse/crash.log" -ErrorAction SilentlyContinue
          "--- event log"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime', 'Windows Error Reporting', 'SideBySide', 'Application Hang' } |
            ForEach-Object { "[$($_.ProviderName)] $($_.Message)" }
          if (-not $alive) { throw "Pulse did not stay up" }
          if (Test-Path "$env:LOCALAPPDATA/Pulse/crash.log") { throw "Pulse wrote a crash log" }
      - name: Update from a local server (9.9.9) and check Pulse restarts on the new files
        run: |
          $dir = "$env:RUNNER_TEMP/clean"
          $env:PULSE_NO_DIALOG = '1'
          # The "new release": the same package plus a marker file, served like GitHub would.
          $srv = "$env:RUNNER_TEMP/srv"
          New-Item -ItemType Directory -Force "$srv/new", "$srv/build/windows-11" | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP/unzipped/*" "$srv/new"
          Set-Content "$srv/new/data/update-marker.txt" '9.9.9'
          $zip = "$srv/build/windows-11/Pulse-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$srv/new/*" -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @{ version = '9.9.9'; files = @{ '${{ matrix.rid }}' = @{ path = 'build/windows-11/Pulse-${{ matrix.rid }}.zip'; sha256 = $sha } } } |
            ConvertTo-Json -Depth 5 | Set-Content "$srv/build/windows-11/latest.json"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -WorkingDirectory $srv -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:PULSE_UPDATE_URL = 'http://127.0.0.1:8765/'

          Start-Process "$dir/data/Pulse.exe" -ArgumentList '--update-check' -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/check.txt"
          $check = Get-Content "$env:RUNNER_TEMP/check.txt" -Raw
          "update-check: $check"
          if ($check -notmatch 'latest=9\.9\.9') { throw "update-check did not see 9.9.9" }

          # Start Pulse, then update it from the command line the way the menu does.
          Start-Process "$dir/Pulse.exe" | Out-Null
          Start-Sleep -Seconds 10
          # Not -Wait: that also waits for the Pulse the update starts, which keeps running.
          $u = Start-Process "$dir/data/Pulse.exe" -ArgumentList '--update' -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/update.txt" -RedirectStandardError "$env:RUNNER_TEMP/update-err.txt"
          if (-not $u.WaitForExit(120000)) { throw "--update did not finish" }
          "update: $(Get-Content "$env:RUNNER_TEMP/update.txt" -Raw) $(Get-Content "$env:RUNNER_TEMP/update-err.txt" -Raw)"
          $app = (Resolve-Path "$dir/data/Pulse.exe").Path
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process Pulse -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $app }
            if ((Test-Path "$dir/data/update-marker.txt") -and $p) { $ok = $true; break }
          }
          Get-ChildItem $dir | Select-Object Name | Format-Table -AutoSize
          if (-not $ok) { throw "Pulse was not replaced and restarted" }
          "Updated and running again: pid $($p.Id)"
          Start-Sleep -Seconds 5
          Start-Process "$dir/Pulse.exe" -ArgumentList '--quit' -Wait
          if (-not $p.WaitForExit(15000)) { throw "Updated Pulse did not quit" }
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          $left = Get-ChildItem $dir -Directory | Where-Object Name -like '*.old-*'
          if ($left) { throw "Backup folders left behind: $($left.Name -join ', ')" }
          "--- crash log"; Get-Content "$env:LOCALAPPDATA/Pulse/crash.log" -ErrorAction SilentlyContinue
          if (Test-Path "$env:LOCALAPPDATA/Pulse/crash.log") { throw "Pulse wrote a crash log" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.rid }}
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: ignore

  publish:
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Pulse-win11-*
          path: /tmp/win
      - name: Put the app in build/windows-11
        run: |
          sudo apt-get install -y zip >/dev/null
          for rid in win-x64 win-arm64; do
            # zip adds to an existing archive, so start from an empty one.
            rm -f build/windows-11/Pulse-$rid.zip
            (cd /tmp/win/Pulse-win11-$rid && zip -qr $GITHUB_WORKSPACE/build/windows-11/Pulse-$rid.zip .)
          done
          git config user.name "njarrar"
          git config user.email "njarrar@gmail.com"
          python3 tools/update_manifest.py windows-11 win-x64=build/windows-11/Pulse-win-x64.zip win-arm64=build/windows-11/Pulse-win-arm64.zip
          git add build/windows-11
          git diff --cached --quiet && exit 0
          git commit -m "Update Windows 11 app in build/windows-11"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i*5)); done
