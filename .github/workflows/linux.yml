name: linux
on:
  push:
    paths: ["native/linux/**", "locales/**", "i18n/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["native/linux/**", "locales/**", "i18n/**", ".github/workflows/linux.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/linux
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-linux
          path: native/linux/target/release/pulse
